<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Charcutería</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h1 { color: #c0392b; margin-bottom: 20px; text-align: center; }
        
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .file-input { grid-column: span 3; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        
        .btn-add { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background: #219150; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background: #f8f9fa; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Panel Administrativo de Productos</h1>

        <h3>Agregar Nuevo Producto</h3>
        <form id="product-form" style="margin-top: 15px;">
            <div class="form-grid">
                <input type="text" id="nombre" placeholder="Nombre del Producto (ej: Queso Paisa)" required>
                <input type="number" step="0.01" id="precio" placeholder="Precio ($)" required>
                <select id="categoria">
                    <option value="charcuteria">Charcutería</option>
                    <option value="quesos">Quesos</option>
                    <option value="viveres">Víveres</option>
                </select>
                <select id="unidad">
                    <option value="Kg">Por Kg</option>
                    <option value="Unidad">Por Unidad</option>
                    <option value="Pack">Por Pack</option>
                </select>
            </div>
            
            <div class="form-grid" style="grid-template-columns: 3fr 1fr;">
                <input type="file" id="imagen" accept="image/*" class="file-input">
                <button type="submit" class="btn-add">Guardar Producto +</button>
            </div>
        </form>

        <hr style="margin: 25px 0;">

        <h3>Inventario Actual</h3>
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="inventory-table"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/productos";

        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                const productos = await res.json();
                renderTable(productos);
            } catch (err) {
                console.error("Error al cargar productos:", err);
            }
        }

        function renderTable(productos) {
            const tbody = document.getElementById('inventory-table');
            tbody.innerHTML = '';
            
            productos.forEach(p => {
                const imgSrc = p.imagen ? `http://127.0.0.1:5000/uploads/${p.imagen}` : 'https://via.placeholder.com/50?text=Sin+Foto';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${imgSrc}" class="img-preview" alt="Foto"></td>
                    <td><strong>${p.nombre}</strong> (${p.unidad})</td>
                    <td>${p.categoria}</td>
                    <td>$${p.precio.toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="deleteProduct(${p.id})">Eliminar</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('categoria', document.getElementById('categoria').value);
            formData.append('unidad', document.getElementById('unidad').value);
            
            const fileInput = document.getElementById('imagen');
            if (fileInput.files[0]) {
                formData.append('imagen', fileInput.files[0]);
            }

            await fetch(API_URL, {
                method: 'POST',
                body: formData // FormData envía multipart/form-data automáticamente
            });

            document.getElementById('product-form').reset();
            fetchProducts();
        });

        async function deleteProduct(id) {
            if(confirm("¿Seguro que deseas eliminar este producto?")) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchProducts();
            }
        }

        fetchProducts();
    </script>
</body>
</html>
