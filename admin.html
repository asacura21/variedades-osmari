<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Variedades Osmari</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Encabezado del Panel */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-title {
            margin: 0;
            font-size: 22px;
            color: #2c3e50;
            font-weight: 700;
        }

        /* Botón de reporte ubicado en la esquina superior */
        .btn-reporte {
            background-color: #17a2b8;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }
        .btn-reporte:hover {
            background-color: #138496;
        }

        /* Barra de acciones (Nuevo Ítem + Filtros) */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Botón compacto de Registrar Nuevo Ítem */
        .btn-nuevo-item {
            background-color: #28a745;
            color: white;
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
            transition: background 0.2s ease;
        }
        .btn-nuevo-item:hover {
            background-color: #218838;
        }

        /* Contenedor de Tabla Profesional */
        .tabla-contenedor {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f1f3f5;
            color: #495057;
            padding: 12px 15px;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }
        tr:hover {
            background-color: #f8f9fa;
        }

        /* Miniaturas de imágenes de productos en el inventario */
        .img-thumb {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        /* Botones de Acción dentro de la tabla */
        .btn-accion {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 4px;
        }
        .btn-editar {
            background-color: #ffc107;
            color: #212529;
        }
        .btn-eliminar {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Encabezado con Botón en la Esquina para Descargar Reporte -->
    <div class="admin-header">
        <h1 class="admin-title">📊 Control de Inventario</h1>
        <a href="/descargar_reporte" class="btn-reporte">
            📥 Descargar Reporte (Excel / PDF)
        </a>
    </div>

    <!-- Barra de Herramientas Completa -->
    <div class="toolbar">
        <button class="btn-nuevo-item" onclick="abrirModalNuevoItem()">
            ➕ Registrar Nuevo Ítem
        </button>
        <span style="font-size: 13px; color: #6c757d;">Total de Productos: 27</span>
    </div>

    <!-- Tabla del Inventario -->
    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Visual</th>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio ($)</th>
                    <th>Unidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Ejemplo de fila de inventario -->
                <tr>
                    <td><img src="/static/uploads/1.jpeg" class="img-thumb" alt="Huevos"></td>
                    <td>1</td>
                    <td><strong>Cartón de Huevos</strong></td>
                    <td>Víveres</td>
                    <td>$8.50</td>
                    <td>Cartón</td>
                    <td>
                        <button class="btn-accion btn-editar">✏️</button>
                        <button class="btn-accion btn-eliminar">🗑️</button>
                    </td>
                </tr>
                <tr>
                    <td><img src="/static/uploads/2.jpeg" class="img-thumb" alt="Queso"></td>
                    <td>2</td>
                    <td><strong>Queso Arepero Fresco</strong></td>
                    <td>Quesos</td>
                    <td>$5.00</td>
                    <td>Kg</td>
                    <td>
                        <button class="btn-accion btn-editar">✏️</button>
                        <button class="btn-accion btn-eliminar">🗑️</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function abrirModalNuevoItem() {
            alert('Abre formulario compacto para registrar nuevo ítem.');
        }
    </script>
</body>
</html>
