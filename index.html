<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARIEDADES OSMARI // Catálogo Oficial</title>
    <style>
        :root {
            --bg-deep: #05070b;
            --bg-card: rgba(13, 20, 35, 0.7);
            --neon-cyan: #00f0ff;
            --neon-green: #00ff66;
            --neon-pink: #ff007f;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 140px;
        }

        header {
            background: rgba(5, 7, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            padding: 1.2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--neon-cyan);
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
        }

        header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

        .categories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cat-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .cat-btn.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.15);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #111;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-info { padding: 15px; }
        .product-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .product-price { color: var(--neon-cyan); font-size: 1.2rem; font-weight: bold; margin: 8px 0; text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
        
        .add-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .cart-section {
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glow);
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 15px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
            max-width: 1100px;
            margin: 0 auto;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .cart-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 1rem; }
        .cart-summary span span { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 102, 0.3); }

        .client-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .client-inputs input, .client-inputs select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        .client-inputs input:focus, .client-inputs select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .client-inputs option { background: #0f172a; color: white; }

        .checkout-btn {
            background: linear-gradient(135deg, #00ff66, #00b347);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }

        .checkout-btn:hover {
            transform: scale(1.01);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.6);
        }

        @media (max-width: 768px) {
            .client-inputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Variedades Osmari ⚡</h1>
        <p>Sistema de Pedidos Autónomo v2.0</p>
    </header>

    <div class="container">
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('todos', event)">[ TODOS ]</button>
            <button class="cat-btn" onclick="filterCategory('charcuteria', event)">[ CHARCUTERÍA ]</button>
            <button class="cat-btn" onclick="filterCategory('quesos', event)">[ QUESOS ]</button>
            <button class="cat-btn" onclick="filterCategory('viveres', event)">[ VÍVERES ]</button>
            <button class="cat-btn" onclick="filterCategory('hogar', event)">[ HOGAR / VARIOS ]</button>
        </div>

        <div class="products-grid" id="products-container"></div>
    </div>

    <div class="cart-section">
        <div class="cart-summary">
            <span>Items en Nodo: <span id="cart-count">0</span></span>
            <span>Total Créditos: $<span id="cart-total">0.00</span></span>
        </div>

        <div class="client-inputs">
            <input type="text" id="client-name" placeholder="Nombre del Cliente">
            <input type="text" id="client-address" placeholder="Dirección de Entrega">
            <select id="payment-method">
                <option value="Pago Móvil">Pago Móvil</option>
                <option value="Efectivo $">Efectivo ($)</option>
                <option value="Zelle">Zelle</option>
            </select>
        </div>

        <button class="checkout-btn" onclick="sendWhatsAppOrder()">
            TRANSMITIR PEDIDO POR WHATSAPP 🚀
        </button>
    </div>

    <script>
        const PHONE_NUMBER = "584120000000"; // Reemplaza con tu número de teléfono
        const API_URL = `${window.location.origin}/api/productos`;
        
        let products = [];
        let cart = {};

        async function loadProducts() {
            try {
                const res = await fetch(API_URL);
                products = await res.json();
                renderProducts(products);
            } catch (err) {
                console.error("Error cargando productos:", err);
            }
        }

        function renderProducts(items) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            if(items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No hay productos registrados en el inventario.</p>';
                return;
            }

            items.forEach(product => {
                const imgSrc = product.imagen 
                    ? `${window.location.origin}/uploads/${product.imagen}` 
                    : 'https://via.placeholder.com/200x150?text=VARIEDADES+OSMARI';

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgSrc}" class="product-img" alt="${product.nombre}">
                    <div class="product-info">
                        <div class="product-title">${product.nombre}</div>
                        <div class="product-price">$${product.precio.toFixed(2)} <span style="font-size:0.8rem; color:var(--text-muted)">/ ${product.unidad}</span></div>
                        <button class="add-btn" onclick="addToCart(${product.id})">+ AGREGAR</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat, event) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(cat === 'todos') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.categoria === cat));
            }
        }

        function addToCart(id) {
            if(cart[id]) {
                cart[id].qty += 1;
            } else {
                const product = products.find(p => p.id === id);
                cart[id] = { ...product, qty: 1 };
            }
            updateCartUI();
        }

        function updateCartUI() {
            let count = 0;
            let total = 0;

            Object.values(cart).forEach(item => {
                count += item.qty;
                total += item.precio * item.qty;
            });

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function sendWhatsAppOrder() {
            const name = document.getElementById('client-name').value.trim();
            const address = document.getElementById('client-address').value.trim();
            const payment = document.getElementById('payment-method').value;

            if (Object.keys(cart).length === 0) {
                alert("El carrito de compras está vacío.");
                return;
            }

            if (!name || !address) {
                alert("Por favor completa tu nombre y dirección de entrega.");
                return;
            }

            let message = `⚡ *TRANSMISIÓN DE PEDIDO - VARIEDADES OSMARI* ⚡\n\n`;
            message += `👤 *Cliente:* ${name}\n`;
            message += `📍 *Ubicación:* ${address}\n`;
            message += `💳 *Método de Pago:* ${payment}\n\n`;
            message += `📦 *Detalle de la Orden:*\n`;

            let total = 0;
            Object.values(cart).forEach(item => {
                const subtotal = item.precio * item.qty;
                total += subtotal;
                message += `• ${item.nombre} x${item.qty} = $${subtotal.toFixed(2)}\n`;
            });

            message += `\n💵 *TOTAL A PAGAR:* $${total.toFixed(2)}`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
